{% extends "base_simple.html" %}

{% block title %}登录 - {{ site_name or '聊天室' }}{% endblock %}

{% block header %}
<header class="topbar">
  <div class="topbar-left">
    <a href="/home" class="logo">💬 {{ site_name or '聊天室' }}</a>
  </div>
  <nav class="topbar-nav">
    <a href="/login" class="nav-login-btn">登录</a>
    <a href="/register" class="nav-register-btn">注册</a>
    <button type="button" class="theme-toggle" id="themeToggle"
            title="切换主题" aria-label="切换主题">🌙</button>
  </nav>
</header>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-box">
    <h1>💬 {{ site_name or '聊天室' }}</h1>
    <form method="POST" action="/login" class="login-form">
      <input type="hidden" name="return_to" value="{{ return_to | default('') }}">
      <label>昵称<input type="text" name="nickname" required autofocus></label>
      <label>密码<input type="password" name="password" required></label>
      <button type="submit">登录</button>
    </form>
    <p class="login-switch">
      还没有账号？<a href="/register{% if return_to %}?return_to={{ return_to | urlencode }}{% endif %}">注册新账号</a>
    </p>
  </div>
</div>
{% endblock %}
