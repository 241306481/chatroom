<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site_name or "聊天室" }}{% endblock %}</title>
<script>  (function () {
    try {
      var t = localStorage.getItem('chatroom_theme')
          || (window.matchMedia
              && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💬</text></svg>">
<link rel="stylesheet" href="/static/css/main.css">
{% block head %}{% endblock %}
</head>
<body>
{% block header %}
<header class="topbar">
  <div class="topbar-left">
    <a href="/home" class="logo">💬 {{ site_name or "聊天室" }}</a>
  </div>
  <nav class="topbar-nav">
    <a href="/home">首页</a>
    <a href="/discuss">讨论</a>
    <button type="button" class="theme-toggle" id="themeToggle"
            title="切换主题" aria-label="切换主题">🌙</button>
  </nav>
</header>
{% endblock %}
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
<script>  (function () {
    var KEY = 'chatroom_theme';
    var stored = localStorage.getItem(KEY);
    var theme = stored || (window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    function updateButton() {
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      var cur = document.documentElement.getAttribute('data-theme');
      btn.textContent = cur === 'dark' ? '☀' : '🌙';
      btn.title = cur === 'dark' ? '切换为浅色' : '切换为深色';
    }
    updateButton();
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('#themeToggle');
      if (!btn) return;
      var cur = document.documentElement.getAttribute('data-theme');
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(KEY, next);
      updateButton();
    });
  })();
</script>
</body>
</html>
