{% extends "base.html" %}
{% block content %}
<div class="page-container">
  <h1>加入申请 · {{ display_name }}</h1>
  {% if applications and applications.length %}
    <table class="user-table">
      <thead><tr><th>用户</th><th>UID</th><th>说明</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>
        {% for a in applications %}
          <tr>
            <td>{{ a.nickname }}</td>
            <td>{{ a.uid }}</td>
            <td class="user-table-message">{{ a.message }}</td>
            <td>{{ a.created_at }}</td>
            <td>
              <form method="POST" action="/domain/{{ domain_name }}/manage/applications" style="display:inline">
                <input type="hidden" name="uid" value="{{ a.uid }}">
                <button type="submit" name="action" value="approve">通过</button>
                <button type="submit" name="action" value="reject"
                        data-confirm="确定拒绝该申请？">拒绝</button>
              </form>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p class="empty">暂无待审批的申请</p>
  {% endif %}
  <p style="margin-top:24px;"><a href="/domain/{{ domain_name }}/manage">← 返回域管理</a></p>
</div>
<script>(function () {
  function check() {
    var err = new URL(location.href).searchParams.get('error');
    if (err && window.showAlert) window.showAlert(err);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', check);
  } else {
    check();
  }
})();
</script>
{% endblock %}
