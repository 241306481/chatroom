{% extends "base_simple.html" %}

{% block title %}注册 - {{ site_name or '聊天室' }}{% endblock %}

{% block header %}
<header class="topbar">
  <div class="topbar-left">
    <a href="/home" class="logo">💬 {{ site_name or '聊天室' }}</a>
  </div>
  <nav class="topbar-nav">
    <a href="/login" class="nav-login-btn">登录</a>
    <a href="/register" class="nav-register-btn">注册</a>
    <button type="button" class="theme-toggle" id="themeToggle"
            title="切换主题" aria-label="切换主题">🌙</button>
  </nav>
</header>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-box">
    <h1>💬 注册账号</h1>
    <form method="POST" action="/register" class="login-form">
      <input type="hidden" name="return_to" value="{{ return_to | default('') }}">
      <label>昵称<input type="text" name="nickname" required autofocus
          pattern="[^0-9\s].*" maxlength="32"
          title="昵称不能以数字开头，长度 1-32"></label>
      <label>密码<input type="password" name="password" required></label>
      <label>确认密码<input type="password" name="confirm_password" required></label>
      <button type="submit">注册</button>
    </form>
    <p class="login-switch">
      已有账号？<a href="/login{% if return_to %}?return_to={{ return_to | urlencode }}{% endif %}">返回登录</a>
    </p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/core/dom.js"></script>
<script src="/static/js/core/modal.js"></script>
<script src="/static/js/core/notify.js"></script>
<script>
(function () {
  var p = new URL(location.href).searchParams;
  var err = p.get('error');
  var rt = p.get('return_to');
  if (rt) {
    var hidden = document.querySelector('input[name="return_to"]');
    if (hidden) hidden.value = rt;
  }
  if (err && window.showAlert) window.showAlert(err);
})();
</script>
{% endblock %}
